name: Tests
on:
  push:
    branches: [main, workers-rewrite]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
