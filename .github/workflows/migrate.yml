name: Migrate D1
# Manual only. Migrations never run on push. Run staging first, then production.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which database to migrate
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read

concurrency:
  group: migrate-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: ${{ inputs.target == 'production' && 'esports-db' || 'esports-db-staging' }}
      ENV_FLAG: ${{ inputs.target == 'production' && '' || '--env staging' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pending migrations (list only)
        run: npx wrangler d1 migrations list "$DB_NAME" --remote $ENV_FLAG
      - name: Apply migrations
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote $ENV_FLAG
